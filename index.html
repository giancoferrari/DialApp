<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content" />

    <!-- Primary meta -->
    <title>Dial Golf</title>
    <meta name="description" content="Track every shot, build a yardage book you can trust, and walk onto the course knowing exactly what each club does." />
    <meta name="author" content="Dial." />

    <!-- Theme & PWA -->
    <meta name="theme-color" content="#F4F5F2" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Dial." />

    <!-- Icons -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <link rel="manifest" href="/manifest.json" />

    <!-- Open Graph (looks good when shared on iMessage, WhatsApp, etc.) -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Dial Golf" />
    <meta property="og:description" content="Track every shot, build a yardage book you can trust, and walk onto the course knowing exactly what each club does." />

    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Geist:wght@300..800&family=Space+Grotesk:wght@400;500;600;700&family=Bricolage+Grotesque:opsz,wght@12..96,700&display=swap"

    />

  <style>html, body { height: 100%; margin: 0; }</style>

    <div id="root" style="height: 100%;"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
