<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <!-- Background green with subtle radial depth -->
    <radialGradient id="bgGrad" cx="38%" cy="32%" r="70%">
      <stop offset="0%"  stop-color="#3a5c38"/>
      <stop offset="100%" stop-color="#1e3a1e"/>
    </radialGradient>

    <!-- Putting green gradient (lighter sage green, top-lit) -->
    <radialGradient id="greenGrad" cx="50%" cy="35%" r="60%">
      <stop offset="0%"  stop-color="#4a6b40"/>
      <stop offset="100%" stop-color="#2d4d28"/>
    </radialGradient>

    <!-- Clip to the inner hole of the D so the scene only shows inside it -->
    <clipPath id="dHole">
      <path d="M196 108 L196 404 L272 404
               C340 404 390 358 390 256
               C390 154 340 108 272 108 Z"/>
    </clipPath>
  </defs>

  <!-- Rounded-square background -->
  <rect width="512" height="512" rx="110" fill="url(#bgGrad)"/>

  <!-- ── Golf scene clipped to the D's inner void ── -->
  <g clip-path="url(#dHole)">
    <!-- Sky / deep background inside the D -->
    <rect x="196" y="108" width="194" height="296" fill="#2a4a26"/>

    <!-- Putting green ellipse — sits low in the D -->
    <ellipse cx="290" cy="355" rx="130" ry="62" fill="url(#greenGrad)"/>
    <!-- Subtle darker fringe around the green -->
    <ellipse cx="290" cy="355" rx="130" ry="62" fill="none"
             stroke="#233d1f" stroke-width="6" opacity="0.4"/>

    <!-- Hole cup (dark circle) -->
    <ellipse cx="276" cy="348" rx="11" ry="7" fill="#141e12"/>

    <!-- Flag pole -->
    <line x1="276" y1="348" x2="276" y2="245"
          stroke="#e8e8e0" stroke-width="5" stroke-linecap="round"/>

    <!-- Flag (triangular, pointing right) -->
    <polygon points="276,245 318,262 276,279" fill="#e8e8e0"/>
  </g>

  <!-- ── The D letterform (white) — drawn as a filled shape with the inner
       void punched out via evenodd so the scene shows through ── -->
  <path fill-rule="evenodd" fill="white"
    d="
      M 118 88
      L 118 424
      L 272 424
      C 368 424 408 358 408 256
      C 408 154 368 88 272 88
      Z

      M 190 152
      L 272 152
      C 334 152 336 198 336 256
      C 336 314 334 360 272 360
      L 190 360
      Z
    "/>
</svg>
